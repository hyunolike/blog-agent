name: Answer evidence checks

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'ingest/**'
      - 'eval/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/answer-quality.yml'

permissions:
  contents: read

concurrency:
  group: answer-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run eval:grounding
      - name: Keyword retrieval (no API key or .env loader)
        run: node --import tsx eval/retrieval.ts
        env:
          NVIDIA_API_KEY: ''
      - run: npm run typecheck
      - run: npm run build
