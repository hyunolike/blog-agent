name: feedback

# /admin에서 승인한 👎를 eval/questions.jsonl에 추가해 develop에 커밋한다.
# 승인이 곧 사람의 검토이므로 PR을 거치지 않는다. Redis는 읽기 전용 토큰으로만 읽는다.
on:
  schedule:
    - cron: "30 19 * * *" # 매일 04:30 KST (ingest 30분 뒤)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feedback
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 비밀값이 아직 없으면 실패 대신 건너뛴다(매일 실패 알림이 쌓이지 않게)
      - id: secrets
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::notice::UPSTASH_REDIS_REST_URL 또는 UPSTASH_REDIS_REST_READONLY_TOKEN이 없어 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          TOKEN: ${{ secrets.UPSTASH_REDIS_REST_READONLY_TOKEN }}
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - name: 승인한 검토를 평가셋에 추가
        if: steps.secrets.outputs.ready == 'true'
        run: npm run feedback
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_READONLY_TOKEN }}
      - id: diff
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if git diff --quiet -- eval/questions.jsonl; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "added=$(git diff -U0 -- eval/questions.jsonl | grep -c '^+{')" >> "$GITHUB_OUTPUT"
          fi
      - name: 검색 품질 평가 (경고만, 커밋은 막지 않음)
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: npm run eval:retrieval
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      - name: 평가셋 커밋
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/questions.jsonl
          git commit -m "chore: 관리자 승인 평가 ${{ steps.diff.outputs.added }}건을 평가셋에 추가"
          # ingest가 그사이 인덱스를 커밋했을 수 있다
          git pull --rebase --quiet
          git push
